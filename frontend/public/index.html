<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00183d" />
    <meta
      name="description"
      content="The Village Academia — quality tuition from KG to Class 12th and professional courses in Lahore."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>The Village Academia</title>
    <style>
      #root {
        min-height: 100vh;
      }

      #root:not(.app-ready) {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2ff 45%, #ffffff 100%);
      }

      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: initialLoaderFadeIn 0.2s ease;
      }

      .initial-loader img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        animation: initialLoaderPulse 1.4s ease-in-out infinite;
      }

      .initial-loader span {
        font-family: 'Poppins', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: #051537;
      }

      @keyframes initialLoaderFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes initialLoaderPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      html[data-theme='dark'] #root:not(.app-ready) {
        background: linear-gradient(145deg, #060a14 0%, #0a1628 50%, #051537 100%);
      }

      html[data-theme='dark'] .initial-loader span {
        color: #f1f5f9;
      }
    </style>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="initial-loader" class="initial-loader" aria-hidden="true">
        <img src="%PUBLIC_URL%/logo192.png" alt="" width="88" height="88" />
        <span>Village Academia</span>
      </div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
